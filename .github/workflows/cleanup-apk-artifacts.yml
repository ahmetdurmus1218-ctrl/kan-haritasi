name: Cleanup old APK artifacts

# One-off cleanup requested by the owner: the account's artifact storage quota
# is full. Deletes the APK artifacts of every "Android APK" run except run #40
# and #41 (the latest builds). Releases (apk-son) and other workflows'
# artifacts are left alone. Runs only when this file is pushed to this branch;
# it is removed right after.
on:
  push:
    branches: [ "ccr-0591bde7-kugv2k" ]
    paths: [ ".github/workflows/cleanup-apk-artifacts.yml" ]

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete APK artifacts of Android APK runs older than #40
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/actions/workflows/android.yml/runs?per_page=100" \
            --jq '.workflow_runs[] | "\(.id)\t\(.run_number)"' > runs.tsv
          echo "Android APK runs: $(wc -l < runs.tsv)"
          freed=0
          while IFS=$'\t' read -r run_id run_number; do
            gh api --paginate "repos/$REPO/actions/runs/$run_id/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired == false) | "\(.id)\t\(.size_in_bytes)\t\(.name)"' > arts.tsv
            while IFS=$'\t' read -r art_id size name; do
              [ -z "$art_id" ] && continue
              if [ "$run_number" = "40" ] || [ "$run_number" = "41" ]; then
                echo "KEEP   run #$run_number  $name  $((size / 1024 / 1024)) MB"
              else
                echo "DELETE run #$run_number  $name  $((size / 1024 / 1024)) MB"
                gh api -X DELETE "repos/$REPO/actions/artifacts/$art_id"
                freed=$((freed + size))
              fi
            done < arts.tsv
          done < runs.tsv
          echo "Freed: $((freed / 1024 / 1024)) MB"
