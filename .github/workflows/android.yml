name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Web çekirdeğini derle
        run: pnpm build
      - name: Güvenlik kapıları (CSP, izleme alan adları)
        run: pnpm check:security

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: İmza anahtarı (tanımlıysa gizli anahtar, yoksa depodaki hata ayıklama anahtarı)
        env:
          KH_KEYSTORE_B64: ${{ secrets.KH_KEYSTORE_B64 }}
        run: |
          if [ -n "$KH_KEYSTORE_B64" ]; then
            echo "$KH_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kh-release.jks"
            echo "KH_KEYSTORE_PATH=$RUNNER_TEMP/kh-release.jks" >> "$GITHUB_ENV"
            echo "::notice::Gizli imza anahtarı kullanılıyor."
          else
            echo "::warning::KH_KEYSTORE_B64 tanımlı değil; APK depodaki HATA AYIKLAMA anahtarıyla imzalanıyor (README)."
          fi

      - name: APK derle
        working-directory: apps/android
        env:
          KH_KEYSTORE_PASSWORD: ${{ secrets.KH_KEYSTORE_PASSWORD }}
          KH_KEY_ALIAS: ${{ secrets.KH_KEY_ALIAS }}
          KH_KEY_PASSWORD: ${{ secrets.KH_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: APK'da INTERNET izni olmamalı
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          APK=$(ls apps/android/app/build/outputs/apk/release/*.apk | head -1)
          "$AAPT2" dump permissions "$APK" | tee perms.txt
          if grep -q "android.permission.INTERNET" perms.txt; then
            echo "::error::APK INTERNET izni içeriyor"; exit 1
          fi
          "$AAPT2" dump badging "$APK" | head -3

      - name: APK'da çalışma zamanı dosyaları eksiksiz olmalı
        run: |
          APK=$(ls apps/android/app/build/outputs/apk/release/*.apk | head -1)
          unzip -l "$APK" | awk '{print $4}' | grep '^assets/web/' > apk-assets.txt
          echo "OCR ve modeller:"; grep -E '^assets/web/(ocr|models)/' apk-assets.txt
          # Android paketleme ".gz" uzantısını siler; web tarafı hiçbir dosyayı bu adla istememeli.
          if grep -E '\.gz$' apk-assets.txt; then echo "::error::APK'da .gz uzantılı varlık var"; exit 1; fi
          for f in index.html ocr/worker.min.js ocr/tesseract-core-simd-lstm.wasm.js ocr/tur.traineddata \
                   models/m/body.glb models/m/skeleton.glb models/m/muscles.glb models/m/cardio.glb \
                   models/f/body.glb models/f/skeleton.glb models/f/reproductive.glb models/f/cardio.glb \
                   ai-models/index.json ai-models/LICENSE-Apache-2.0.txt; do
            grep -qx "assets/web/$f" apk-assets.txt || { echo "::error::APK'da eksik: $f"; exit 1; }
          done
          # Gömülü tıbbi modeller: index.json'daki her modelin dosyaları APK'da olmalı
          for m in $(python3 -c "import json;print(' '.join(json.load(open('apps/web/public/ai-models/index.json'))['models']))"); do
            for f in model.onnx manifest.json NOTICE.txt; do
              grep -qx "assets/web/ai-models/$m/$f" apk-assets.txt || { echo "::error::APK'da eksik: ai-models/$m/$f"; exit 1; }
            done
          done

      - name: APK'yı adlandır
        id: name
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          mkdir -p out
          cp apps/android/app/build/outputs/apk/release/*.apk "out/KanHaritasi-${VERSION}.apk"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          sha256sum out/*.apk | tee out/SHA256SUMS.txt

      - name: Anatomi paketleri resmi listeyle eşleşmeli (APK'ya girmez, ayrı indirilir)
        run: |
          mkdir -p out-packs
          python3 - <<'PY'
          import hashlib, json, re, zipfile, pathlib, sys
          src = pathlib.Path('apps/web/src/anatomy/packs.generated.ts').read_text()
          index = json.loads(re.search(r'PACK_INDEX = (\[.*\]) as const', src, re.S).group(1))
          ok = True
          for e in index:
              f = pathlib.Path('anatomy-packs') / e['file']
              if not f.exists():
                  print(f"::error::paket yok: {f}"); ok = False; continue
              z = zipfile.ZipFile(f)
              glb = z.read('model.glb'); man = json.loads(z.read('manifest.json'))
              sha = hashlib.sha256(glb).hexdigest()
              if sha != e['sha256'] or man['model']['sha256'] != sha or 'ATTRIBUTION.txt' not in z.namelist():
                  print(f"::error::paket doğrulanamadı: {f}"); ok = False
              else:
                  print(f"{e['file']}: {sha[:16]}… {f.stat().st_size // 1024} KB")
          sys.exit(0 if ok else 1)
          PY
          cp anatomy-packs/*.khpack out-packs/
          (cd out-packs && sha256sum *.khpack > SHA256SUMS-paketler.txt)
          unzip -l apps/android/app/build/outputs/apk/release/*.apk | grep -q khpack && { echo "::error::paket APK'ya girmiş"; exit 1; } || true

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: KanHaritasi-anatomi-paketleri-${{ steps.name.outputs.version }}
          path: out-packs/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: KanHaritasi-APK-${{ steps.name.outputs.version }}
          path: out/
          # Kalıcı indirme yeri Releases → apk-son; buradaki kopya kısa süreli (kota).
          retention-days: 7

      - name: "Son sürüm: telefondan indirilebilir yayın (apk-son)"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.name.outputs.version }}
        run: |
          gh release delete apk-son --yes --cleanup-tag || true
          gh release create apk-son out/*.apk out/SHA256SUMS.txt out-packs/*.khpack out-packs/SHA256SUMS-paketler.txt \
            --target "$GITHUB_SHA" --prerelease \
            --title "Kan Haritası ${VERSION} (son derleme)" \
            --notes "main dalının son derlemesi (${GITHUB_SHA::7}). APK'yı telefondan indirip kur. Veriler yalnızca cihazda, şifreli; uygulamanın internet izni yoktur. İsteğe bağlı ayrıntılı anatomi paketleri (anatomi-*.khpack, Z-Anatomy CC BY-SA 4.0): indirip uygulamada Gizlilik ve veriler → Anatomi paketleri → Paket kur ile ekle; SHA-256 özeti uygulama içinde doğrulanır."
