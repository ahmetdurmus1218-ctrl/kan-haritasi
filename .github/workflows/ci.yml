name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (güvenlik kuralları dahil)
        run: pnpm lint
      - name: Tip denetimi
        run: pnpm typecheck
      - name: Testler (kripto, kurcalama, silme, doğrulama, XSS)
        run: pnpm test
      - name: Derleme
        run: pnpm build
      - name: Güvenlik kapıları (CSP, izleme alan adları, test verisinde kimlik no)
        run: pnpm check:security
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Bağımlılık açıkları (OSV)
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            -r
            ./
