name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (güvenlik kuralları dahil)
        run: pnpm lint
      - name: Tip denetimi
        run: pnpm typecheck
      - name: Testler (kripto, kurcalama, silme, doğrulama, XSS)
        run: pnpm test
      - name: Derleme
        run: pnpm build
      - name: Güvenlik kapıları (CSP, izleme alan adları, test verisinde kimlik no)
        run: pnpm check:security
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Bağımlılık açıkları (OSV)
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            -r
            ./

  # Faz 2: Android kabuğu eklendiğinde bu iş etkinleşir.
  android-permissions:
    if: ${{ hashFiles('apps/android/app/build.gradle.kts') != '' }}
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/android/app/src/main/assets/web
      - run: cd apps/android && ./gradlew :app:assembleRelease
      - name: APK'da INTERNET izni olmamalı
        run: |
          AAPT2=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          APK=$(ls apps/android/app/build/outputs/apk/release/*.apk | head -1)
          if $AAPT2 dump permissions "$APK" | grep -q "android.permission.INTERNET"; then
            echo "INTERNET izni bulundu"; exit 1
          fi
