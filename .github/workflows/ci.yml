name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    # Testler gerçek tıbbi modelleri (BT/MR 3B, basamaklı patoloji, röntgen) cihaz motoruyla çalıştırır.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (güvenlik kuralları dahil)
        run: pnpm lint
      - name: Tip denetimi
        run: pnpm typecheck
      - name: Testler (kripto, kurcalama, silme, doğrulama, XSS)
        run: pnpm test
      - name: Derleme
        run: pnpm build
      - name: Güvenlik kapıları (CSP, izleme alan adları, test verisinde kimlik no)
        run: pnpm check:security

  e2e:
    # Gerçek Chromium'da uçtan uca: kasa, yükleme, PDF/OCR okuma, 3D keşif ve simülasyon,
    # zaman çizelgesi, şifreli yedek → başka kasaya geri yükleme, ZIP dışa aktarma, MR/BT (DICOM) görüntüleme;
    # CSP ihlali ve dış istek yok.
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Playwright (Chromium)
        run: |
          pip install playwright==1.56.0 pillow
          python -m playwright install --with-deps chromium
      - name: Önizleme sunucusu
        run: |
          (cd apps/web && nohup npx vite preview --port 4173 --strictPort > "$RUNNER_TEMP/preview.log" 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
      - name: Belgeler ve kasa (smoke)
        run: python tests/e2e/smoke.py "$RUNNER_TEMP/shots"
      - name: Okuma → sonuçlar → vücutta göster → simülasyon
        run: python tests/e2e/flow.py "$RUNNER_TEMP/shots"
      - name: Zaman çizelgesi, şifreli yedek, dışa aktarma
        run: python tests/e2e/data.py "$RUNNER_TEMP/shots"
      - name: Farklı laboratuvar raporları (PDF, fotoğraf, ekran görüntüsü) → yorum → 3B
        run: python tests/e2e/reports.py "$RUNNER_TEMP/shots"
      - name: Görüntüleme — MR klasörü (DICOM seri), BT pencereleri, radyoloji raporu, terimler
        run: python tests/e2e/imaging.py "$RUNNER_TEMP/shots"
      - name: Ham görüntü analizi (rapor yok) — MR, EKG, ultrason, patoloji → Vücudum → organ sayfası
        run: python tests/e2e/multimodal.py "$RUNNER_TEMP/shots"
      - name: Yerel tıbbi AI (test modeli, cihazda) — üç durum, kutu → anatomi → organ, rapor ↔ model çelişkisi, MPR
        run: python tests/e2e/localai.py "$RUNNER_TEMP/shots"
      - name: Gerçek yerel modeller — röntgen skoru, BT/MR 3B anatomi bölütleme, BT patoloji (basamaklı), köken
        run: python tests/e2e/realmodels.py "$RUNNER_TEMP/shots"
      - name: Keşfet — iki vücut, bilgi bulutu, arama, araçlar, tema, 22 sahne, telefon
        run: python tests/e2e/explore.py "$RUNNER_TEMP/shots/explore"
      # Ekran görüntüleri yalnızca test düşerse yüklenir: her çalıştırmada ~40 MB yüklemek
      # Actions depolama kotasını doldurup APK yüklemesini engelliyordu.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: failure()
        with:
          name: e2e-ekran-goruntuleri
          path: ${{ runner.temp }}/shots
          retention-days: 3

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Bağımlılık açıkları (OSV)
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            -r
            ./
