# HTTPS üzerinden telefonda denemek için isteğe bağlı yayın. Elle çalıştırılır.
# GitHub Pages özel başlık (_headers) desteklemez; CSP index.html içindeki meta etiketiyle uygulanır.
# Sunucu yalnızca uygulama dosyalarını sunar; raporlar ve sonuçlar tarayıcıdan çıkmaz.
name: Pages (elle)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test && pnpm build && pnpm check:security
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
