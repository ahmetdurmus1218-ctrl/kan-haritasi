# Web sürümü (iPhone/iPad Safari, masaüstü tarayıcılar): her main gönderiminde ve elle yayımlanır.
# Derlenen uygulama `gh-pages` dalına yazılır; GitHub Pages bu daldan sunar
# (ilk kez: Settings → Pages → Source: Deploy from a branch → gh-pages / root).
# GitHub Pages özel başlık (_headers) desteklemez; CSP index.html içindeki meta etiketiyle uygulanır.
# Sunucu yalnızca uygulama dosyalarını sunar; raporlar ve sonuçlar tarayıcıdan çıkmaz.
name: Pages (web sürümü)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test && pnpm build && pnpm check:security
      - name: gh-pages dalına yaz
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          cd apps/web/dist
          # Jekyll işlemesin: "_" ile başlayan dosyalar da sunulsun
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "web: $SHA"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" gh-pages
          echo "Yayın: https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO#*/}/"
